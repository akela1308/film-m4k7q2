<title>Мама. Диафильм про нас</title>
<style>
/* Layout: a dark room, one projected frame, the story beside it (below it on a phone), the film strip along the bottom. */
:root{
  --room:#0c1230; --room-2:#141c44; --room-3:#1f2a5e;
  --ink:#f5f0e2; --ink-2:#b9c3ea; --lamp:#ffd66b; --lamp-ink:#1b1a2b;
  --film:#05081a; --paper:#fbf8ef;
  --display:'Neucha','Golos Text',system-ui,sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-screen:18px; --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
@font-face{font-family:'Neucha';src:url(font-neucha-cyrillic-400-normal.woff2) format('woff2');font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Neucha';src:url(font-neucha-latin-400-normal.woff2) format('woff2');font-display:swap;unicode-range:U+0000-00FF,U+2013-2014,U+2018-201D,U+2026,U+00AB,U+00BB}
@font-face{font-family:'Golos Text';font-weight:400;src:url(font-golos-text-cyrillic-400-normal.woff2) format('woff2');font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Golos Text';font-weight:600;src:url(font-golos-text-cyrillic-600-normal.woff2) format('woff2');font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Golos Text';font-weight:400;src:url(font-golos-text-latin-400-normal.woff2) format('woff2');font-display:swap;unicode-range:U+0000-00FF,U+2013-2014,U+2018-201D,U+2026,U+00AB,U+00BB}
@font-face{font-family:'Golos Text';font-weight:600;src:url(font-golos-text-latin-600-normal.woff2) format('woff2');font-display:swap;unicode-range:U+0000-00FF,U+2013-2014,U+2018-201D,U+2026,U+00AB,U+00BB}
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;touch-action:manipulation;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--room);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;
  background-image:radial-gradient(120% 70% at 30% -10%,var(--room-3) 0%,var(--room) 62%);background-attachment:fixed;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding:14px 16px 170px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.top{display:flex;justify-content:space-between;align-items:center;grid-gap:12px;gap:12px;margin-bottom:12px}
.brand{font-family:var(--display);font-size:22px;line-height:1.1;color:var(--ink-2)}
.count{display:flex;align-items:center;grid-gap:8px;gap:8px;font-size:16px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.count svg{width:18px;height:18px;fill:var(--lamp)}
.brand{flex:1;min-width:0}
.snd{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--lamp);display:grid;place-items:center;position:relative}
.snd svg{width:24px;height:24px;fill:currentColor}
.snd.off{color:var(--ink-2)}
.snd.off::after{content:'';position:absolute;left:9px;right:9px;top:50%;height:2px;background:currentColor;transform:rotate(-45deg);border-radius:2px}
.snd:active{transform:scale(.94)}
.count b{color:var(--ink);font-weight:600}
.stage{display:grid;grid-gap:18px;gap:18px;grid-template-columns:minmax(0,1fr)}
.screen{position:relative;width:100%;height:0;padding-top:62.5%;border-radius:var(--r-screen);overflow:hidden;background:var(--film);
  box-shadow:0 28px 60px -26px rgba(0,0,0,.85);touch-action:pan-y}
.art{position:absolute;top:0;right:0;bottom:0;left:0}
.art svg{display:block;width:100%;height:100%}
.left{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-gap:14px;gap:14px;align-content:start}
.show{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;pointer-events:none;transition:opacity .9s ease;z-index:2;background:var(--film)}
.screen.showing .show{opacity:1}
.screen.showing .star{opacity:0;pointer-events:none}
.star{transition:opacity .5s ease}
.ly{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transition:opacity 1.3s ease;display:flex;align-items:center;justify-content:center;background:var(--film);overflow:hidden}
.ly.on{opacity:1}
.ly svg{display:block;width:100%;height:100%}
.ly img{display:block;flex:none;max-width:86%;max-height:88%;width:auto;height:auto;object-fit:contain;border:7px solid var(--paper);border-radius:3px;box-shadow:0 18px 40px -18px rgba(0,0,0,.8)}
.ly.on img{animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(.96)}to{transform:scale(1.02)}}
.songbar{display:flex;align-items:center;grid-gap:14px;gap:14px}
.songbar[hidden]{display:none}
.sg{flex:1;min-width:0;display:grid;grid-gap:2px;gap:2px}
.sgt{display:flex;align-items:baseline;grid-gap:10px;gap:10px;min-width:0}
.sgt b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;white-space:nowrap}
.sgt span{color:var(--ink-2);font-size:15px;white-space:nowrap}
.sgt .time{margin-left:auto;min-width:0}
.sg .seek{width:100%}
.art.adv{animation:adv .55s var(--ease)}
@keyframes adv{0%{transform:translateX(7%);opacity:0;filter:blur(6px)}100%{transform:none;opacity:1;filter:none}}
.star{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;padding:0;border:0;background:none;border-radius:50%;display:grid;place-items:center}
.star svg{width:34px;height:34px;fill:var(--lamp);stroke:var(--lamp-ink);stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 2px 6px rgba(10,12,30,.55));transition:transform .25s var(--ease)}
.star:not(.seen) svg{animation:tw 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.37s)}
.star.seen svg{fill:rgba(245,240,226,.2);stroke:var(--ink);stroke-width:1.8}
.star:hover svg{transform:scale(1.15)}
.star.on svg{fill:#fff;stroke:var(--lamp-ink);transform:scale(1.25);animation:none}
@keyframes tw{0%,100%{transform:scale(1)}50%{transform:scale(.82) rotate(8deg)}}
.side{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;grid-gap:18px;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:34px;font-size:clamp(34px,6.2vw,50px);line-height:1.04;margin:0 0 12px;text-wrap:balance;letter-spacing:.005em}
.story p{margin:0 0 12px;max-width:62ch;text-wrap:pretty}
.story p.sign{font-family:var(--display);font-size:28px;margin-top:18px}
.hint{color:var(--ink-2);font-size:16px;margin:4px 0 0}
.tip{display:flex;align-items:center;grid-gap:10px;gap:10px;margin:0 0 12px;font-family:var(--display);font-size:23px;line-height:1.15;color:var(--lamp)}
.tip svg{flex:none;width:24px;height:24px;fill:var(--lamp);animation:tw 2.6s ease-in-out infinite}
.nfg .tip>*+*{margin-left:10px}
.row{display:flex;flex-wrap:wrap;grid-gap:6px;gap:6px;margin-top:10px;align-items:center}
.row .lbl{color:var(--ink-2);font-size:16px;margin-right:6px}
.chip{width:44px;height:44px;border:0;background:none;padding:0;display:grid;place-items:center;border-radius:50%}
.chip svg{width:26px;height:26px;fill:var(--lamp);stroke:none}
.chip.seen svg{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linejoin:round}
.chip.on{background:var(--room-3)}
.find{border-top:2px dashed rgba(255,214,107,.5);padding-top:16px;display:grid;grid-template-columns:minmax(0,1fr);grid-gap:14px;gap:14px}
.find .lead{margin:0;max-width:60ch;color:var(--ink-2)}
.find blockquote{margin:0;font-family:var(--display);font-size:25px;font-size:clamp(25px,4.6vw,32px);line-height:1.22;white-space:pre-line;color:var(--ink);max-width:28ch;word-break:break-word;overflow-wrap:anywhere}
.find blockquote.long{font-size:21px;font-size:clamp(21px,3.8vw,25px);max-width:38ch;line-height:1.3}
.find .by{margin:0;color:var(--lamp);font-size:16px}
.print{margin:0;display:grid;grid-template-columns:minmax(0,1fr);grid-gap:10px;gap:10px;justify-items:start}
.print button{border:0;padding:8px 8px 8px;background:var(--paper);border-radius:3px;box-shadow:0 14px 30px -14px rgba(0,0,0,.7);display:block;max-width:100%;line-height:0}
.print img{display:block;max-width:100%;height:auto;max-height:58vh;max-height:min(58vh,520px);width:auto}
.print figcaption{font-family:var(--display);font-size:24px;line-height:1.15;color:var(--ink)}
.note{font-family:var(--display);font-size:28px;line-height:1.2;margin:0;max-width:26ch}
.tape{display:grid;grid-template-columns:minmax(0,1fr);grid-gap:12px;gap:12px;max-width:440px}
.tape svg{width:100%;height:auto;display:block}
.tape .reel{transform-box:fill-box;transform-origin:center}
.tape.playing .reel{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ctl{display:flex;align-items:center;grid-gap:12px;gap:12px}
.play{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--lamp);color:var(--lamp-ink);display:grid;place-items:center}
.play svg{width:24px;height:24px;fill:currentColor}
.play:active{transform:scale(.96)}
.seek{flex:1;min-width:0;accent-color:var(--lamp);height:28px}
.time{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
.acts{display:flex;flex-wrap:wrap;grid-gap:10px;gap:10px;margin-top:4px}
.btn{border:2px solid var(--ink-2);background:none;color:var(--ink);border-radius:999px;padding:10px 18px;min-height:48px;font-weight:600;font-size:17px}
.btn.pri{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.btn:active{transform:translateY(1px)}
.reelbar{position:fixed;left:0;right:0;bottom:0;background:var(--film);border-top:1px solid #1d2550;padding:6px 10px 8px;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;grid-template-areas:'strip strip' 'prev next';grid-gap:6px 10px;gap:6px 10px;align-items:center;z-index:5}
.strip{grid-area:strip}#prev{grid-area:prev;justify-self:start}#next{grid-area:next;justify-self:end;min-width:150px}
.strip{display:flex;grid-gap:6px;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;padding:9px 2px;
  background-image:radial-gradient(circle,rgba(245,240,226,.5) 2.2px,transparent 2.6px),radial-gradient(circle,rgba(245,240,226,.5) 2.2px,transparent 2.6px);
  background-size:16px 8px,16px 8px;background-position:0 0,0 100%;background-repeat:repeat-x}
.strip::-webkit-scrollbar{display:none}
.cell{flex:none;scroll-snap-align:center;min-width:92px;height:52px;border:0;border-radius:6px;background:var(--room-2);color:var(--ink-2);padding:2px 10px;font-family:var(--display);font-size:19px;line-height:1.05;display:grid;place-items:center;text-align:center}
.cell small{display:block;font-family:var(--body);font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.cell.cur{background:var(--ink);color:var(--lamp-ink)}
.cell.done small::after{content:' ★';color:var(--lamp)}
.cell.cur.done small::after{color:#9a6a00}
.nav{border:0;border-radius:999px;min-height:52px;padding:0 20px;font-weight:600;font-size:18px;background:var(--lamp);color:var(--lamp-ink);white-space:nowrap}
.nav.back{background:var(--room-3);color:var(--ink);padding:0 16px}
.nav:disabled{opacity:.35;cursor:default}
dialog{border:0;padding:0;background:rgba(5,8,26,.96);color:var(--ink);width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none}
dialog::backdrop{background:rgba(5,8,26,.9)}
dialog:not([open]){display:none}
dialog.fb[open]{display:block;position:fixed;top:0;left:0;z-index:30}
.lb{width:100%;height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-gap:10px;gap:10px;padding:14px;justify-items:center;align-items:center}
.lb img{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 110px);max-height:calc(var(--vh,100vh) - 110px);object-fit:contain;border:8px solid var(--paper);border-radius:3px}
.lb .btn{margin-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:960px){
  body{font-size:19px}
  .wrap{padding-top:20px;padding-bottom:120px}
  .reelbar{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'prev strip next';padding-top:8px}
  #next{min-width:0}
  .print img{max-height:46vh;max-height:min(46vh,460px)}
  .stage{grid-template-columns:minmax(0,1.62fr) minmax(320px,1fr);grid-gap:36px;gap:36px;align-items:start}
  .brand{font-size:26px}
  .side{padding-top:6px}
  .star{width:52px;height:52px;margin:-26px 0 0 -26px}.star svg{width:40px;height:40px}
}
@media (max-width:520px){
  .brand{font-size:19px}.top{grid-gap:6px;gap:6px}
  #sgsub{display:none}.sgt b{font-size:22px}
  .star{width:42px;height:42px;margin:-21px 0 0 -21px}.star svg{width:31px;height:31px}
}
@media (max-width:959px) and (max-height:720px){
  .strip{padding:7px 2px}.cell{height:44px;font-size:17px;min-width:84px}
  .nav{min-height:46px;font-size:17px}
}
.nfg .top>*+*{margin-left:10px}
.nfg .count>*+*{margin-left:8px}
.nfg .songbar>*+*{margin-left:14px}
.nfg .sgt>*+*:not(.time){margin-left:10px}
.nfg .ctl>*+*{margin-left:12px}
.nfg .strip>*+*{margin-left:6px}
.nfg .row>*{margin:0 6px 6px 0}
.nfg .acts>*{margin:0 10px 10px 0}
@media (max-width:959px){
  .story.first h1{display:none}
  body{background-attachment:scroll}
  .star svg{filter:none}
  .art.adv{animation-name:advm}
}
@keyframes advm{0%{transform:translateX(5%);opacity:0}100%{transform:none;opacity:1}}
@media (orientation:landscape) and (max-height:540px) and (max-width:959px){
  body{font-size:16px;line-height:1.5}
  .wrap{padding:6px 12px 76px}
  .top{margin-bottom:4px}
  .brand{font-size:17px}
  .snd{width:36px;height:36px}
  .count{font-size:14px}
  .stage{grid-template-columns:auto minmax(0,1fr);grid-gap:16px;gap:16px;align-items:start}
  .left{position:-webkit-sticky;position:sticky;top:6px;width:calc((100vh - 122px) * 1.6);width:calc((var(--vh,100vh) - 122px) * 1.6);max-width:58vw;grid-gap:6px;gap:6px}
  .left.hasbar{width:calc((100vh - 176px) * 1.6);width:calc((var(--vh,100vh) - 176px) * 1.6)}
  .songbar .play{width:44px;height:44px}
  .sgt b{font-size:19px}#sgsub{display:none}
  h1{font-size:28px;margin-bottom:8px}
  .side{grid-gap:12px;gap:12px}
  .story p.sign{font-size:22px;margin-top:10px}
  .reelbar{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'prev strip next';padding:4px 8px 4px;padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
  #next{min-width:0}
  .strip{padding:6px 2px}.cell{height:40px;min-width:76px;font-size:16px}.cell small{font-size:11px}
  .nav{min-height:42px;font-size:16px;padding:0 14px}.nav.back{padding:0 12px}
  .print img{max-height:70vh}
  .star{width:42px;height:42px;margin:-21px 0 0 -21px}.star svg{width:31px;height:31px}
}
.tg .wrap{padding-top:calc(14px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
.tg .reelbar{padding-bottom:calc(8px + var(--tg-safe-area-inset-bottom,0px))}
.tg .lb{padding-top:calc(14px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));padding-bottom:calc(14px + var(--tg-safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){.art.adv,.star svg,.tip svg,.tape.playing .reel,.ly.on img{animation:none!important}.star svg{transition:none}}
</style>

<body>
<!-- THESIS: a family diafilm, one projected frame at a time; refuses the scrolling memorial page with a hero and cards. OWN-WORLD: a dark room, night-blue ground, lamp-yellow stars, hand-lettered Neucha titles, flat gouache frames, a perforated film strip as the timeline. STORY: mom advances the film with one button, taps stars inside each frame to find a photo, her own words, or a song. FIRST VIEWPORT: the title card of the film, lit in the dark, with the film strip under it. RISK: the drawn people are generic; likeness lives in the real photographs behind the stars. -->
<div class="wrap">
  <header class="top">
    <div class="brand">Мама. Диафильм про нас</div>
    <button type="button" class="snd" id="snd" aria-pressed="true" aria-label="Выключить музыку" title="Музыка"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5 20 2v13.2a3.3 3.3 0 1 1-2-3V6.3L11 7.4v9.8a3.3 3.3 0 1 1-2-3z"/></svg></button>
    <div class="count" aria-label="Найдено звёздочек"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l2.9 6.5 7 .7-5.3 4.7 1.6 6.9L12 17l-6.2 3.6 1.6-6.9L2.1 9l7-.7z"/></svg><span><b id="count">0</b> из 94</span></div>
  </header>
  <main class="stage">
    <div class="left">
      <div class="screen"><div class="art"></div><div class="show" aria-hidden="true"><div class="ly"></div><div class="ly"></div></div></div>
      <div class="songbar" hidden>
        <button type="button" class="play" id="sgplay" aria-label="Включить песню"><svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg></button>
        <div class="sg"><div class="sgt"><b id="sgtitle"></b><span id="sgsub"></span><span class="time" id="sgtime">0:00</span></div>
        <input class="seek" id="sgseek" type="range" min="0" max="1000" value="0" aria-label="Перемотка песни"></div>
      </div>
    </div>
    <div class="side" aria-live="polite"></div>
  </main>
</div>

<script type="application/json" id="data">{"ch": [{"id": "nachalo", "scene": "title", "when": "начало", "title": "Мама. Диафильм про нас", "text": ["Мама, это тебе.", "Листай кадры кнопкой Дальше. На каждом кадре спрятаны звёздочки. Нажмёшь на звёздочку, и откроется фотография, твоё сообщение или песня.", "Все сообщения здесь настоящие. Я взял их из нашей переписки и под каждым подписал, когда оно было отправлено."], "finds": []}, {"id": "sestry", "scene": "sisters", "when": "4 октября", "title": "Две девочки у ёлки", "text": ["Ты и Вера родились в один день, 4 октября, и до сих пор празднуете вместе.", "На старых карточках вы стоите у ёлки: одна в короне, другая в шапке с ушками. Я смотрел и не мог понять, кто из вас кто. Потом ты подсказала."], "finds": [{"kind": "photo", "img": "p2018", "cap": "Та самая лисичка.", "lead": null, "x": 66.7, "y": 45}, {"kind": "photo", "img": "p2017", "cap": "Вера в короне.", "lead": null, "x": 53.3, "y": 44}, {"kind": "quote", "text": "Смешнулька мой!!!\nЛисичка тоже весёлая!!!\nХотя помню, что расстроилась, тоже хотела прынцессой быть)))", "by": "мама, апрель 2023", "lead": "Я угадывал, где на карточках ты. Ты написала: Лисичка я. А потом добавила:", "cut": false, "x": 61, "y": 20}, {"kind": "photo", "img": "p3755", "cap": "Стамбул.", "lead": null, "x": 86, "y": 22}, {"kind": "photo", "img": "p1930", "cap": "В автобусе. Попробуй отличи.", "lead": null, "x": 40, "y": 74}, {"kind": "quote", "text": "Нет!!!! Безобразие!!! Почему мы так похожи стали!!!!", "by": "мама, октябрь 2021", "lead": "Ты прислала кружок, а я ответил: привет, Вер.", "cut": true, "x": 22, "y": 30}, {"kind": "photo", "img": "p4563", "cap": "Вдвоём на теплоходе.", "lead": null, "x": 92, "y": 80}]}, {"id": "korpus", "scene": "house", "when": "1992", "title": "Корпус 1401", "text": ["Потом появился я. 13 августа 1992 года, Зеленоград.", "Мы жили втроём в однушке в корпусе 1401: ты, папа и я. Рядом был магазин «Всё для дома», папа одно время работал там в отделе красок. Ещё с нами жила кошка Изаура, её подобрали в подъезде."], "finds": [{"kind": "photo", "img": "p4001", "cap": "Я у тебя на руках, папа держит Изауру. Рядом Вера и Маша.", "lead": null, "x": 45, "y": 48}, {"kind": "quote", "text": "Совсем маленьким ты любил играть с половником, любил кататься на ледяной горке, любил залезать в свой домик", "by": "мама, февраль 2024", "lead": "Я спросил, что я любил делать в детстве. Ты прислала целый список. Он начинается так:", "cut": true, "x": 39, "y": 89}, {"kind": "quote", "text": "Помнишь как \"бледная\" Воспиталка говорила :--Сразу видно ваш мальчик --\"-голубых кровей\"!)))", "by": "мама, апрель 2022", "lead": "Про детский сад:", "cut": true, "x": 79, "y": 74}, {"kind": "quote", "text": "Я часто вспоминаю ,как я ,тебя даже уже большинького ,любила качать на ручках.\nИ -----чеши- гладь!!!", "by": "мама, март 2023", "lead": null, "cut": true, "x": 60, "y": 91}]}, {"id": "domik", "scene": "room", "when": "детство", "title": "Домик в стенке", "text": ["В комнате стояли ваша кровать, моя кровать и стенка. Одно отделение в стенке было моим домиком. Вы приделали к дверце ручку, чтобы я мог закрываться.", "На полу лежал ковёр с дорожками. Мягкие игрушки я называл друзьями: первой была обезьяна, потом появились дракончик и все остальные. Мы играли в охотников на динозавров, читали про братца Кролика и разыгрывали козюх. Козюха делается из руки: два пальца вперёд, это рога, остальные три это ноги. Одну звали Макароновая."], "finds": [{"kind": "quote", "text": "Любил рисовать-- на кухне( в 14 ом районе) под подоконником я вешала для тебя огромные листы, на которых ты калякал- малякал всякую всячину.", "by": "мама, февраль 2024", "lead": null, "cut": true, "x": 80, "y": 62}, {"kind": "quote", "text": "Любил рассказки сочинять и записывать на магнитофон-- хочется верить, что эти записи где то лежат, просто на глаза давно что то не попадались", "by": "мама, февраль 2024", "lead": null, "cut": false, "x": 26, "y": 27}, {"kind": "photo", "img": "p4046", "cap": "С Мейсоном у ёлки.", "lead": "Потом у нас появился Мейсон. Серый, мы в шутку звали его помойным котом и очень любили.", "x": 76, "y": 43}, {"kind": "quote", "text": "Помню, что нашли!\n…\nВспомнила как мультики ждали и смотрели всё вместе,-- с папкой", "by": "мама, декабрь 2025", "lead": "У нас с Жекой были одинаковые динозавры. Моего потеряли в лесу и искали всей семьёй.", "cut": true, "x": 58, "y": 84}, {"kind": "quote", "text": "помнишь как в твоём детстве яички с горки катали-- я делала горку из доски и нужно было чтобы яичко, скотиашись коснулось другого яичка!", "by": "мама, май 2024", "lead": "На Красную горку:", "cut": true, "x": 75, "y": 91}, {"kind": "note", "text": "Папа звал меня медвежонком. Иногда кролём.", "x": 40, "y": 53}, {"kind": "quote", "text": "любил залезать в свой домик--\nэто было одно из отделений в стенке( где у тебя внизу хранились журналы Топ гид-- это чтоб ты представил эту дверцу), мы сделали к ней ручку, чтобы ты мог закрываться", "by": "мама, февраль 2024", "lead": null, "cut": true, "x": 27, "y": 71}]}, {"id": "pesnya", "scene": "lullaby", "when": "вечер", "title": "Песня перед сном", "text": ["Перед сном ты мне пела. «Голубой звездопад» я любил больше всех. «За полчаса до весны» тоже оттуда, я её до сих пор напеваю.", "А одну песню ты сочинила сама, про маленького конька. И слова твои, и мелодия. Ты считаешь, что она слишком простая, а я считаю, что её надо передавать по наследству. Найди кассету."], "finds": [{"kind": "tape", "src": "audio-konek.mp3", "title": "Конёк", "sub": "стихи Любови Ильиной", "note": "Это твоя песня. Ты её написала, а потом мы вместе дописали к ней продолжение.", "x": 88, "y": 64}, {"kind": "quote", "text": "Песню про конька тебе напевала, мелодию сама придумала, незнаю может похож на чью то.", "by": "мама, сентябрь 2023", "lead": null, "cut": true, "x": 47, "y": 30}, {"kind": "quote", "text": "Обожаю эту песню, моя любимая с детства)))", "by": "мама, ноябрь 2022", "lead": "Про «За полчаса до весны» ты написала:", "cut": true, "x": 62, "y": 22}, {"kind": "quote", "text": "Ты любил- Маленького принца, Путешествие в страну- мульти- пульти! Сказки Киплинга-- черепаха неспешная, кажется про кита..... забыла... грб( про верблюда что ли) ...", "by": "мама, январь 2025", "lead": "А ещё вы с папой мне читали. Я спросил, какие сказки я любил.", "cut": false, "x": 30, "y": 70}, {"kind": "quote", "text": "Я в детстве мечтал , что ты будешь петь", "by": "Максим, март 2023", "lead": "Однажды ты прислала мне голосовым колыбельную на ночь. Я ответил:", "cut": false, "x": 16, "y": 30}]}, {"id": "lyzhnya", "scene": "ski", "when": "зима", "title": "Лыжня до Радищева", "text": ["Зимой вставали на лыжи. Лес начинался почти от дома, и уходили мы далеко.", "Вы с папой катаетесь до сих пор. Про открытие сезона в этом январе ты мне доложила."], "finds": [{"kind": "quote", "text": "Сегодня вспоминали как с\nтобой на лыжах ходили далеко, почти к станции Радищево, и ты был очень выносливым!!!\nТолько нужно было с тобой играть в \"попессора \"Боброва!", "by": "мама, март 2023", "lead": null, "cut": true, "x": 69, "y": 50}, {"kind": "quote", "text": "А мы открыли лыжный сезон, конечно, папка сопротивлялся, хотел отложить всё на завтра, но куда он денется))))---\nпокатались, я уже и упасть успела)))", "by": "мама, январь 2026", "lead": null, "cut": true, "x": 56, "y": 76}, {"kind": "photo", "img": "p4318", "cap": "На лыжне. Январь 2026 года.", "lead": null, "x": 20, "y": 84}, {"kind": "photo", "img": "p4310", "cap": "Папа, который сопротивлялся.", "lead": null, "x": 38, "y": 90}, {"kind": "photo", "img": "p733", "cap": "Первое января 2022 года.", "lead": null, "x": 82, "y": 22}, {"kind": "photo", "img": "p3229", "cap": "Январь 2024 года.", "lead": null, "x": 10, "y": 60}]}, {"id": "pole", "scene": "field", "when": "лето", "title": "Через поле в Лесное", "text": ["Когда мы купили участок в Лесном под Конаково, на Южной улице, машины у нас ещё не было. Ехали на электричке до Донховки, а оттуда час или полтора пешком: сначала через поле, потом через Полесье.", "Я убегал вперёд, подпрыгивал и кричал, что лечу. По дороге пели походные песни. Дома ещё не было, стояла одна бытовка, в ней и жили. Потом построили дом, я спал на втором этаже. И было пять яблонь."], "finds": [{"kind": "quote", "text": "Ещё пели, ----В траве сидел Кузнечик, когда шли через Полесье в Лесное)))", "by": "мама, май 2022", "lead": null, "cut": false, "x": 22, "y": 29}, {"kind": "quote", "text": "Лапа мой, покушал котлетку на чёрном хлебе? Чудесные воспоминания детства!!! Мы с папой тоже вспоминаем иногда те времена)))", "by": "мама, май 2021", "lead": "На Конаковском вокзале мы ели котлету на чёрном хлебе. Ничего вкуснее я не помню.", "cut": false, "x": 6, "y": 48}, {"kind": "quote", "text": "Там на даче спит твоё\nДетство! 💖", "by": "мама, декабрь 2025", "lead": null, "cut": true, "x": 92, "y": 43}, {"kind": "photo", "img": "p3970", "cap": "Сад в Лесном.", "lead": null, "x": 50, "y": 20}, {"kind": "photo", "img": "p2311", "cap": "Яблоня.", "lead": "А яблони растут до сих пор.", "x": 88, "y": 80}, {"kind": "quote", "text": "Этот год яблочный!\nЗреют яблочки, правда много осыпается недозревших, но скоро начнётся -- борьба с урожаем!", "by": "мама, июль 2023", "lead": null, "cut": true, "x": 12, "y": 84}, {"kind": "photo", "img": "p3964", "cap": "Наши цветочки у дома.", "lead": null, "x": 80, "y": 22}]}, {"id": "zvyozdy", "scene": "stars", "when": "август", "title": "Раскладушки и звёзды", "text": ["А ещё было Свитино, за Вороновом: дача бабушки Ани и дедушки Юры. Там поле, по которому мы носились с Машей и Олей, стог сена и родник, куда ходили с пятилитровыми бутылями. На пруду я ловил сачком стрекоз, в лужах высматривал тритонов.", "Там же, у бабушки с дедушкой, мы с тобой по вечерам выносили раскладушки, ложились и смотрели в небо. Искали падающие звёзды, спутники и летающие тарелки."], "finds": [{"kind": "quote", "text": "Звездопад каждый год перед твоим Днём Рождения, сыночек мой ненаглядный)", "by": "мама, август 2025", "lead": null, "cut": false, "x": 72, "y": 16}, {"kind": "quote", "text": "Солнышко моё!!!\nСлавный мой! Хорошие воспоминания -- греют душу,!!!нужно чтобы их было как можно больше, вот у тебя сейчас много приятных моментов ,и они тоже попадут в копилку твоих приятностей, о которых ты будешь вспоминать когда-то !!!", "by": "мама, май 2022", "lead": "Я написал тебе: хорошо мы на звёзды в детстве с тобой смотрели, лежали на раскладушках. Ты ответила:", "cut": false, "x": 36, "y": 79}, {"kind": "quote", "text": "Солнышко моё!\nЗвёздочка моя ясная!!!", "by": "мама, август 2023", "lead": null, "cut": true, "x": 86, "y": 40}, {"kind": "photo", "img": "p2222", "cap": "С девчонками на даче.", "lead": null, "x": 84, "y": 66}, {"kind": "photo", "img": "p2221", "cap": "Танцую.", "lead": null, "x": 81, "y": 92}, {"kind": "quote", "text": "Любил смотреть на всякую строительную технику\nС девчонками на даче играть, смотреть на звезды\nЛовить тритонов", "by": "мама, февраль 2024", "lead": null, "cut": false, "x": 27, "y": 21}, {"kind": "photo", "img": "p2502", "cap": "Свитино. Лето, стол на улице.", "lead": null, "x": 11, "y": 64}, {"kind": "photo", "img": "p4335", "cap": "Свитино. На качелях.", "lead": null, "x": 50, "y": 48}, {"kind": "photo", "img": "p4486", "cap": "Ёж пришёл знакомиться.", "lead": null, "x": 62, "y": 62}, {"kind": "photo", "img": "p4339", "cap": "Свитино. Все за одним столом.", "lead": null, "x": 49, "y": 13}, {"kind": "photo", "img": "p2607", "cap": "Свитино. Все в сборе на крыльце.", "lead": null, "x": 12, "y": 38}]}, {"id": "teplohod", "scene": "river", "when": "каникулы", "title": "Теплоход", "text": ["Ездили и далеко. Плавали на теплоходах, на «Кржижановском» и на «Плеханове», заходили в Углич.", "Есть карточка, где мы с тобой стоим у моря, я тебе чуть выше пояса. Где это снято, я не помню. Может быть, Евпатория. А ещё был зоопарк. Там я показал на какую-то упитанную птицу и объявил: соловей."], "find   var tp = {x:0, y:0, t:0, still:false}, lastEnd = 0, sent = 0;

  }, {passive:true});

const BG = D.bg, BGV = 0.5, snd = $('#snd');
let bg = null, bv = 0, bgOn = true, bgStarted = false, fadeT = null;
function sndUI(){ snd.classList.toggle('off', !bgOn); snd.setAttribute('aria-pressed', bgOn ? 'true' : 'false'); snd.setAttribute('aria-label', bgOn ? 'Выключить музыку' : 'Включить музыку'); }
function fade(to, done){
  clearInterval(fadeT);
  fadeT = setInterval(() => {
    const d = to - bv;
    if(Math.abs(d) <= .05){ bv = to; clearInterval(fadeT); fadeT = null; } else bv += Math.sign(d) * .05;
    if(bg){ try { bg.volume = bv; } catch(e) {} }
    if(fadeT === null && done) done();
  }, 45);
}
function bgPlay(){
  if(!BG || !bgOn || !bgStarted || document.hidden) return;
  if(audio && !audio.paused) return;
  if(song && !song.paused) return;
  if(SONG && isLast() && !songDone) return;
  if(!bg){ bg = new Audio(BG); bg.loop = true; bv = 0; try { bg.volume = 0; } catch(e) {} }
  const p = bg.play();
  if(p && p.then) p.then(() => fade(BGV)).catch(() => { bgStarted = false; });
  else fade(BGV);
}
function bgPause(){ if(bg) fade(0, () => { if(bg && bv === 0) bg.pause(); }); }
function stopAudio(){ if(audio){ audio.pause(); audio = null; bgPlay(); } }

const SONG = D.song, songbar = $('.songbar'), sgplay = $('#sgplay'), sgseek = $('#sgseek'), sgtime = $('#sgtime');
const lys = [...document.querySelectorAll('.show .ly')];
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
let song = null, songDone = false, slideIdx = -1, lyOn = 0, songResume = false;
const isLast = () => cur === CH.length - 1;
if(SONG){ $('#sgtitle').textContent = SONG.title; $('#sgsub').textContent = SONG.sub; }
function slideAt(t){ let k = -1; SONG.slides.forEach((s, i) => { if(t >= s.t) k = i; }); return k; }
function setSlide(k){
  if(k === slideIdx) return; slideIdx = k;
  const s = k < 0 ? null : SONG.slides[k];
  if(!s || s.end){ screen.classList.remove('showing'); return; }
  lyOn ^= 1; const ly = lys[lyOn];
  ly.innerHTML = s.s ? document.getElementById('sc-' + s.s).innerHTML : '<img src="img-' + s.p + '.jpg" alt="">';
  lys.forEach(l => l.classList.toggle('on', l === ly));
  screen.classList.add('showing');
}
function songUI(){
  const on = !!song && !song.paused;
  sgplay.innerHTML = on ? ICON_PAUSE : ICON_PLAY; sgplay.setAttribute('aria-label', on ? 'Пауза' : 'Включить песню');
}
function songPlay(fromStart){
  if(!SONG) return;
  if(!song){
    song = new Audio(SONG.src);
    song.addEventListener('timeupdate', () => {
      if(!song) return;
      if(song.duration){ sgseek.value = Math.round(song.currentTime / song.duration * 1000); sgtime.textContent = fmt(song.currentTime) + ' / ' + fmt(song.duration); }
      if(!song.paused) setSlide(slideAt(song.currentTime));
    });
    song.addEventListener('play', () => { slideIdx = -2; setSlide(slideAt(song.currentTime)); songUI(); });
    song.addEventListener('pause', () => { slideIdx = -1; screen.classList.remove('showing'); songUI(); });
    song.addEventListener('ended', () => { songDone = true; bgPlay(); });
    song.addEventListener('error', () => { sgtime.textContent = 'запись не открылась'; });
  }
  if(fromStart || song.ended){ try { song.currentTime = 0; } catch(e) {} }
  songDone = false;
  if(audio && !audio.paused) audio.pause();
  bgPause();
  const p = song.play(); if(p && p.catch) p.catch(() => { songUI(); });
}
function songStop(){
  if(song){ song.pause(); song = null; }
  slideIdx = -1; screen.classList.remove('showing'); sgseek.value = 0; sgtime.textContent = '0:00'; songUI();
}
function frameMusic(auto){
  if(!SONG) return;
  document.querySelector('.left').classList.toggle('hasbar', isLast());
  if(isLast()){
    songbar.hidden = false;
    if(auto && bgOn && !song){ songDone = false; songPlay(true); }
  } else {
    songbar.hidden = true;
    if(song) songStop();
    bgPlay();
  }
}

function findHTML(f, c, i){
  let h = '';
  if(f.lead) h += '<p class="lead">'+esc(f.lead)+'</p>';
  if(f.kind === 'photo'){
    const m = META[f.img];
    h += '<figure class="print"><button type="button" class="zoom" aria-label="Открыть фотографию крупно"><img src="img-'+f.img+'.jpg" width="'+m[0]+'" height="'+m[1]+'" alt="'+esc(f.cap)+'"></button>'
       + '<figcaption>'+esc(f.cap)+'</figcaption></figure>';
  } else if(f.kind === 'quote'){
    h += '<blockquote class="'+(f.text.length > 170 ? 'long' : '')+'">'+esc(f.text)+'</blockquote><p class="by">'+esc(f.by)+(f.cut ? ', из сообщения' : '')+'</p>';
  } else if(f.kind === 'note'){
    h += '<p class="note">'+esc(f.text)+'</p>';
  } else if(f.kind === 'tape'){
    h += '<div class="tape">'+cassette(f)+'<div class="ctl"><button type="button" class="play" aria-label="Включить песню">'
       + '<svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg></button>'
       + '<input class="seek" id="seek-'+c+'-'+i+'" type="range" min="0" max="1000" value="0" aria-label="Перемотка"><span class="time">0:00</span></div></div>'
       + '<p class="lead">'+esc(f.note)+'</p>';
  }
  const n = CH[c].finds.length;
  h += '<div class="acts">';
  if(n > 1) h += '<button type="button" class="btn pri" data-go="'+((i+1)%n)+'">Следующая звёздочка</button>';
  h += '<button type="button" class="btn" data-go="-1">К рассказу</button></div>';
  return h;
}

function render(){
  const ch = CH[cur];
  stopAudio();
  art.innerHTML = document.getElementById('sc-' + ch.scene).innerHTML;
  screen.querySelectorAll('.star').forEach(e => e.remove());
  ch.finds.forEach((f, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'star' + (seen.has(key(cur,i)) ? ' seen' : '') + (i === open ? ' on' : '');
    b.style.left = f.x + '%'; b.style.top = f.y + '%'; b.style.setProperty('--i', i);
    b.setAttribute('aria-label', 'Звёздочка ' + (i+1) + ': ' + KIND[f.kind]);
    b.innerHTML = STARSVG; b.dataset.i = i; screen.appendChild(b);
  });
  let h = '<section class="story' + (cur === 0 ? ' first' : '') + '">' + (cur === 1 && D.tip ? '<p class="tip">' + STARSVG + '<span>' + esc(D.tip) + '</span></p>' : '') + '<h1>' + esc(ch.title) + '</h1>';
  ch.text.forEach((p, k) => { h += '<p' + (cur === CH.length-1 && k === ch.text.length-1 ? ' class="sign"' : '') + '>' + esc(p) + '</p>'; });
  if(ch.finds.length){
    h += '<div class="row"><span class="lbl">Звёздочки кадра:</span>';
    ch.finds.forEach((f, i) => { h += '<button type="button" class="chip' + (seen.has(key(cur,i)) ? ' seen' : '') + (i === open ? ' on' : '') + '" data-i="'+i+'" aria-label="Звёздочка '+(i+1)+': '+KIND[f.kind]+'">'+STARSVG+'</button>'; });
    h += '</div>';
  }
  h += '</section>';
  if(open >= 0) h += '<section class="find" id="find" tabindex="-1">' + findHTML(ch.finds[open], cur, open) + '</section>';
  side.innerHTML = h;
  countEl.textContent = seen.size;
  strip.querySelectorAll('.cell').forEach((c, k) => {
    c.classList.toggle('cur', k === cur);
    c.classList.toggle('done', CH[k].finds.length > 0 && CH[k].finds.every((f, i) => seen.has(key(k,i))));
    if(k === cur) c.setAttribute('aria-current', 'step'); else c.removeAttribute('aria-current');
  });
  prev.disabled = cur === 0;
  next.textContent = cur === 0 ? 'Начать' : (cur === CH.length-1 ? 'В начало' : 'Дальше');
}

function center(smooth){
  const c = strip.children[cur]; if(!c) return;
  const a = c.getBoundingClientRect(), b = strip.getBoundingClientRect();
  strip.scrollTo({left: strip.scrollLeft + (a.left - b.left) - (b.width - a.width)/2, behavior: smooth ? 'smooth' : 'auto'});
}

function go(n, animate){
  cur = (n + CH.length) % CH.length; open = -1; render(); frameMusic(true);
  if(animate !== false){ art.classList.remove('adv'); void art.offsetWidth; art.classList.add('adv'); }
  center(true);
  if(!inTG){ try { history.replaceState(null, '', '#' + CH[cur].id); } catch(e) {} }
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function show(i){
  open = i;
  if(i >= 0){ seen.add(key(cur, i)); save(); }
  render();
  if(i >= 0){
    const f = document.getElementById('find');
    if(f && window.matchMedia('(max-width: 959px)').matches) f.scrollIntoView({behavior: 'smooth', block: 'start'});
  }
}

screen.addEventListener('click', e => { const s = e.target.closest('.star'); if(s) show(+s.dataset.i); });
side.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if(chip){ show(+chip.dataset.i); return; }
  const g = e.target.closest('[data-go]'); if(g){ const v = +g.dataset.go; show(v); if(v < 0) window.scrollTo({top:0, behavior:'smooth'}); return; }
  const z = e.target.closest('.zoom'); if(z){ const im = z.querySelector('img'); const d = document.getElementById('lb'); d.querySelector('img').src = im.src; d.querySelector('img').alt = im.alt; if(d.showModal) d.showModal(); else { d.classList.add('fb'); d.setAttribute('open', ''); } return; }
  const p = e.target.closest('.play');
  if(p){
    const f = CH[cur].finds[open], box = p.closest('.tape'), seek = box.querySelector('.seek'), time = box.querySelector('.time');
    if(!audio){
      audio = new Audio(f.src);
      audio.addEventListener('timeupdate', () => { if(audio && audio.duration){ seek.value = Math.round(audio.currentTime / audio.duration * 1000); time.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration); } });
      audio.addEventListener('ended', () => { bgPlay(); box.classList.remove('playing'); p.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg>'; p.setAttribute('aria-label','Включить песню'); });
      audio.addEventListener('error', () => { time.textContent = 'запись не открылась'; box.classList.remove('playing'); });
      seek.addEventListener('input', () => { if(audio && audio.duration) audio.currentTime = seek.value / 1000 * audio.duration; });
    }
    if(audio.paused){ if(song && !song.paused) song.pause(); audio.play().then(() => { bgPause(); box.classList.add('playing'); p.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'; p.setAttribute('aria-label','Пауза'); }).catch(() => { time.textContent = 'запись не открылась'; }); }
    else { audio.pause(); box.classList.remove('playing'); p.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg>'; p.setAttribute('aria-label','Включить песню'); bgPlay(); }
  }
});
document.addEventListener('click', e => {
  if(bgStarted) return; bgStarted = true;
  if(e.target.closest('.songbar, #snd, #next, #prev, .cell')) { bgPlay(); return; }
  if(SONG && isLast() && bgOn && !song) songPlay(true); else bgPlay();
}, true);
snd.addEventListener('click', () => {
  bgOn = !bgOn; sndUI();
  if(!bgOn){ bgPause(); if(song && !song.paused) song.pause(); }
  else if(SONG && isLast() && !songDone){ songPlay(!song); }
  else bgPlay();
});
sgplay.addEventListener('click', () => { if(song && !song.paused) song.pause(); else songPlay(!song); });
sgseek.addEventListener('input', () => { if(song && song.duration){ song.currentTime = sgseek.value / 1000 * song.duration; if(!song.paused) setSlide(slideAt(song.currentTime)); } });
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    if(bg){ clearInterval(fadeT); fadeT = null; bv = 0; bg.pause(); }
    songResume = !!song && !song.paused; if(songResume) song.pause();
  } else if(songResume){ songResume = false; songPlay(false); }
  else bgPlay();
});
sndUI();
document.getElementById('lb').addEventListener('click', e => { const d = e.currentTarget; if(d.close) d.close(); else d.removeAttribute('open'); });
next.addEventListener('click', () => go(cur + 1));
prev.addEventListener('click', () => { if(cur > 0) go(cur - 1); });
strip.addEventListener('click', e => { const c = e.target.closest('.cell'); if(c) go(+c.dataset.k); });
document.addEventListener('keydown', e => {
  if(document.getElementById('lb').open) return;
  if(e.target.matches('input')) return;
  if(e.key === 'ArrowRight') go(cur + 1); else if(e.key === 'ArrowLeft' && cur > 0) go(cur - 1);
});
let sx = null, sy = 0;
screen.addEventListener('pointerdown', e => { if(e.target.closest('.star')) { sx = null; return; } sx = e.clientX; sy = e.clientY; });
screen.addEventListener('pointerup', e => { if(sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){ if(dx < 0) go(cur + 1); else if(cur > 0) go(cur - 1); } });

const start = Math.max(0, CH.findIndex(c => '#' + c.id === location.hash));
cur = start; render(); frameMusic(false);
center(false);
})();
</script>
</body>
</html>
